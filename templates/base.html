<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Student Hub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app/css/base.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M8 15h8"/></symbol>
    <symbol id="cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M9 16l2 2 4-4"/></symbol>
    <symbol id="doc" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
  </svg>

  <header class="navbar">
    <div class="brand">
      <div class="logo"></div>
      <span class="brand-name">Student Hub</span>
      <span class="brand-pill">FOE-AU</span>
    </div>
    <nav class="nav-links">
      <a href="#" class="nav-link active">Home</a>
      <a href="#" class="nav-link">Labs</a>
      <a href="#" class="nav-link">Events</a>
      <a href="#" class="nav-link">Used Items</a>
      <a href="#" class="nav-link">Lost &amp; Found</a>
    </nav>
    <div class="user-pill"><div class="avatar">U</div><span>User</span></div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-left"><a href="#">Privacy &amp; Policy</a><a href="#">Terms of Services</a></div>
    <div class="footer-center">© 2026 Student Hub. All rights reserved.</div>
    <div class="footer-right"><a href="#">User Guide</a></div>
  </footer>
</body>
</html>
